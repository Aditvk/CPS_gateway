version: '3.8'

services:
  gateway:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: multimodal-llm-security-gateway
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - GATEWAY_KEYS_DIR=/app/keys
      - PYTHONUNBUFFERED=1
    volumes:
      - ../keys:/app/keys
      - ../steganalysis/model_weights:/app/steganalysis/model_weights
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
